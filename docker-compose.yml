services:
  mcpo-control-panel:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8083:8083"
      - "8088:8088"
    # expose:
    #   - "8083"
    #   - "8088"
    volumes:
      - /home/mcpo:/data
      - /home:/home
      - /nas:/nas
      - /content:/content
      - /var/run/docker.sock:/var/run/docker.sock
      - /home/trav/.ssh/id_ed25519:/root/.ssh/id_ed25519
      - /home/trav/.ssh/known_hosts:/root/.ssh/known_hosts
    environment:
      MCPO_MANAGER_HOST: "0.0.0.0"
      MCPO_MANAGER_PORT: "8083"
      MCPO_MANAGER_DATA_DIR: "/data"
    restart: unless-stopped
    command: ["uv", "run", "python", "-m", "mcpo_control_panel", "--host", "0.0.0.0", "--port", "8083", "--config-dir", "/data"]
